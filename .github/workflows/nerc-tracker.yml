name: Regulatory Tracking Station

on:
  schedule:
    - cron: "7 5 * * *"
      timezone: "America/Chicago"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: regulatory-tracker
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run semantic comparison tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Validate V2 data contract
        run: python tests/validate_v2_contract.py

      - name: Run NERC semantic tracker
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
        run: python nerc_tracker.py

      - name: Run FERC tracker
        continue-on-error: true
        run: python ferc_tracker.py

      - name: Commit regulatory tracking data
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/data/ state/
            git commit -m "Update regulatory control room data"
            git push
          else
            echo "No data files changed."
          fi
